server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # O front chama /api/...; o nginx repassa para a API sem o prefixo.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
