# Broker MQTT do Sinaliza (Eclipse Mosquitto 2). ETAPA: infraestrutura de aquisição (sem ML).
# Uso local e acadêmico: sem senha nem TLS. Em produção, ligar `password_file` e TLS (porta 8883).
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
