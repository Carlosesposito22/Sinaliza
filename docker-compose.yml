services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sinaliza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sinaliza}
      POSTGRES_DB: sinaliza
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-mlflow.sql:/docker-entrypoint-initdb.d/init-mlflow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinaliza -d sinaliza"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    build: mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://sinaliza:${POSTGRES_PASSWORD:-sinaliza}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts --serve-artifacts
      --allowed-hosts mlflow:5000,localhost:*,127.0.0.1:*,localhost,127.0.0.1
      --workers 1
    environment:
      # Desliga o executor de "jobs" do MLflow (GenAI), que sobe ~8 processos de ~190 MB e não usamos.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    ports:
      - "5000:5000"
    volumes:
      - mlartifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Orquestrador do pipeline de dados e de ML (fluxos em pipeline/dags). Interface em http://localhost:8080.
  # Sem login (SimpleAuthManager com todos admin): só para uso local. Consome alguns GB de memória.
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sinaliza:${POSTGRES_PASSWORD:-sinaliza}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # Poucos workers: as tarefas pesadas (treino) são sequenciais e cada processo extra gasta memória.
      AIRFLOW__CORE__PARALLELISM: "4"
      # O token da API de execução vence em 10 min por padrão e derruba tarefas longas (Optuna, treino).
      AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME: "86400"
      # Usadas pelas tarefas (pacote textgloss).
      SINALIZA_ROOT: /opt/sinaliza
      SINALIZA_DATABASE_URL: postgresql+psycopg://sinaliza:${POSTGRES_PASSWORD:-sinaliza}@postgres:5432/sinaliza
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_DISABLE_AGENT_HINT: "1"
      SINALIZA_RETENCAO_DIAS: ${SINALIZA_RETENCAO_DIAS:-30}
      # Máquina limpa (sem `corpus_bruto` no banco): o Airflow roda sozinho ingestão → preparação → treino na
      # primeira subida. Perfil `demo` usa uma amostra pequena (minutos); `completo` usa o corpus todo (horas).
      # Ambiente que já tem dados não é tocado. Ver airflow/bootstrap.sh e references/14.
      SINALIZA_AUTO_PIPELINE: ${SINALIZA_AUTO_PIPELINE:-true}
      SINALIZA_PERFIL: ${SINALIZA_PERFIL:-completo}
    volumes:
      - ./pipeline/dags:/opt/airflow/dags:ro
      - ./textgloss:/opt/sinaliza/textgloss:ro
      # A lista fixa (referência sem ML) é lida do código-fonte da API; ver textgloss/modeling.py.
      - ./api/app/text_to_gloss.py:/opt/sinaliza/api/app/text_to_gloss.py:ro
      - dados:/opt/sinaliza/data
      - airflow-logs:/opt/airflow/logs
    # Só sobe depois da API ficar pronta: o modelo T1 tem pico de ~2,8 GB na carga e não cabe junto com o Airflow
    # num Docker de 4 GB.
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      api:
        condition: service_healthy

  # Mock da API para o time do web trabalhar sem o ML. Usa a porta 8000, a mesma da `api`:
  # suba um OU outro. `docker compose --profile mock up mock-api`
  mock-api:
    profiles: ["mock"]
    build:
      context: .
      dockerfile: mock-api/Dockerfile
    ports:
      - "8000:8000"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Arquivo de movimentos montado do host (derivado do V-LIBRASIL: fora do repositório).
      # Sem ele, a API usa o stub (um aceno de teste).
      SINALIZA_MOTIONS: /srv/motions/motions.npz
      # ML nosso: o classificador T1 (`sinaliza-t1`) vem do MLflow em segundo plano; até chegar (ou se o
      # MLflow estiver fora), a API usa a lista fixa e avisa em `model_version`.
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SINALIZA_MODEL_CACHE: /srv/model-cache
      # "false": não carrega o modelo e usa só a lista fixa (para Docker com pouca memória; ver references/14).
      SINALIZA_USE_MODEL: ${SINALIZA_USE_MODEL:-true}
      # Cada frase atendida é gravada em `inferencias` (monitoramento e painel). O TEXTO só é gravado para o
      # simulador ou se SINALIZA_LOG_TEXT=true (o texto digitado pode ter dado pessoal); o DAG
      # `monitoramento` apaga o texto depois de SINALIZA_RETENCAO_DIAS.
      SINALIZA_LOG_DATABASE_URL: postgresql+psycopg://sinaliza:${POSTGRES_PASSWORD:-sinaliza}@postgres:5432/sinaliza
      SINALIZA_LOG_TEXT: ${SINALIZA_LOG_TEXT:-false}
    volumes:
      - type: bind
        source: ${SINALIZA_MOTIONS_DIR:-./data/motions}
        target: /srv/motions
        read_only: true
      - modelcache:/srv/model-cache
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    # `/ready` só dá 200 depois da primeira tentativa de carregar o modelo (ou se ele está desligado); sem modelo
    # registrado, a API também fica pronta e atende com a lista fixa.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  # Painel de monitoramento (Streamlit): frases por hora, latência, palavras sem sinal, probabilidades do modelo,
  # últimas inferências, versão e métricas do modelo (MLflow) e estado dos serviços. http://localhost:8501
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "8501:8501"
    environment:
      SINALIZA_DATABASE_URL: postgresql+psycopg://sinaliza:${POSTGRES_PASSWORD:-sinaliza}@postgres:5432/sinaliza
      SINALIZA_API_URL: http://api:8000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Endereço do MLflow aberto no navegador (o link do painel); o de cima é o interno da rede do compose.
      SINALIZA_MLFLOW_PUBLIC_URL: http://localhost:5000
      SINALIZA_AIRFLOW_URL: http://airflow:8080
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      # Raiz do repositório: o build baixa os sinais do VLibras a partir de data/vocabulary.json.
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  mlartifacts:
  modelcache:
  dados:
  airflow-logs:
